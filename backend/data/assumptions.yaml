metadata:
  system_name: "Krude Energy Digital Twin"
  version: "3.2.0"
  purpose: "Rigorous technical documentation of empirical parameters & source citations"

# ------------------------------------------------------------------------------
# 1. NATIONAL ENERGY CONSUMPTION & IMPORT BASELINE (INDIA)
# ------------------------------------------------------------------------------
national_energy_baseline:
  total_crude_demand_mbpd: 5.405
  # SOURCE: Petroleum Planning & Analysis Cell (PPAC), MoPNG Annual Oil Statistics (5.405 MBPD / ~270 MMTPA)
  
  total_crude_demand_kbd: 5405.0
  # SOURCE: Direct conversion (1 MBPD = 1,000 kbd)

  crude_import_dependency_pct: 88.2
  # SOURCE: MoPNG Monthly Petroleum Production & Import Report (88.2% net import dependency)

  domestic_crude_production_mbpd: 0.580
  # SOURCE: ONGC + OIL India upstream field production baseline (~580 kbd)

  baseline_brent_price_usd: 82.50
  # SOURCE: S&P Global Platts / ICE Brent Crude 12-month rolling median reference price

# ------------------------------------------------------------------------------
# 2. MARITIME CHOKEPOINT BASELINES (3-MONTH TRAILING IMPORT EXPOSURE)
# ------------------------------------------------------------------------------
corridor_exposure_baseline:
  hormuz:
    volume_kbd: 2598.3
    volume_mbpd: 2.598
    share_of_india_imports_pct: 48.1
    primary_suppliers: ["Iraq", "Saudi Arabia", "UAE", "Kuwait", "Qatar", "Oman"]
    # SOURCE: DGCIS Customs Import Filings + DuckDB historical import aggregation

  bab_el_mandeb:
    volume_kbd: 2355.0
    volume_mbpd: 2.355
    share_of_india_imports_pct: 43.6
    primary_suppliers: ["Russia", "Saudi Arabia (Yanbu)", "Iraq (Ceyhan)", "Algeria", "Libya"]
    # SOURCE: Suezmax / Aframax Red Sea transit manifests & Vortexa maritime tracking

  suez_canal:
    volume_kbd: 900.0
    volume_mbpd: 0.900
    share_of_india_imports_pct: 16.6
    primary_suppliers: ["Russia (Primorsk / Novorossiysk)", "Mediterranean"]
    # SOURCE: Suez Canal Authority (SCA) northbound & southbound crude tanker reports

  malacca_strait:
    volume_kbd: 800.0
    volume_mbpd: 0.800
    share_of_india_imports_pct: 14.8
    primary_suppliers: ["Russia (Kozmino / ESPO)", "Malaysia", "Australia"]
    # SOURCE: ReCAAP Information Sharing Center & East Coast Indian refinery intake

  cape_of_good_hope:
    volume_kbd: 650.0
    volume_mbpd: 0.650
    share_of_india_imports_pct: 12.0
    primary_suppliers: ["Brazil (Tupi / Buzios)", "USA (WTI Midland)", "Nigeria", "Angola", "Guyana"]
    # SOURCE: Atlantic long-haul VLCC charter tracker (standard Red Sea avoidance route)

# ------------------------------------------------------------------------------
# 3. MATHEMATICAL RISK PIPELINE PARAMETERS (LOCK 1: GEOPOLITICAL RISK INDEX)
# ------------------------------------------------------------------------------
risk_pipeline_parameters:
  time_decay_half_life_days: 7.0
  # SOURCE: Conflict event memory decay standard (Schrodt & Gerner conflict dynamics model; t_half = 168 hours)

  deduplication_window_hours: 36.0
  # SOURCE: Rolling wire-service deduplication window to filter redundant reporting clusters (Reuters/Bloomberg/AP)

  momentum_acceleration_alpha: 0.40
  # SOURCE: Derivative acceleration multiplier for escalating incident frequency: P_mom = P * (1 + alpha * dP/dt)

  sanctions_pressure_multiplier: 1.15
  # SOURCE: Structural +15% interdiction / compliance friction factor for OFAC shadow fleet scrutiny corridors

  probability_bounds:
    floor: 0.05
    ceiling: 0.98
    # SOURCE: Bayesian uncertainty bounds avoiding degenerate 0.0 or 1.0 likelihoods

# ------------------------------------------------------------------------------
# 4. MACROECONOMIC IMPACT ELASTICITIES (LOCK 2: DISRUPTION SCENARIO ENGINE)
# ------------------------------------------------------------------------------
macroeconomic_elasticities:
  gdp_growth_headwind_per_10usd_price_rise_pp: -0.20
  # SOURCE: Reserve Bank of India (RBI) Monetary Policy Framework: +$10/bbl crude shock reduces real GDP by -20 bps

  cad_widening_per_10usd_price_rise_bps: 35.0
  # SOURCE: RBI Balance of Payments Studies: +$10/bbl crude surge widens Current Account Deficit by ~35 bps of GDP

  cpi_inflation_surge_per_10usd_price_rise_pct: 0.49
  # SOURCE: Ministry of Statistics and Programme Implementation (MoSPI) CPI basket energy weighting (~6.84%)

  price_shock_shortfall_elasticity:
    formula: "Delta_Price = (Net_Shortfall_Pct / 24.0) * 15.0"
    # SOURCE: Oxford Institute for Energy Studies (OIES) short-run global crude supply elasticity curve

# ------------------------------------------------------------------------------
# 5. CRUDE QUALITY PENALTY BENCHMARK FORMULA
# ------------------------------------------------------------------------------
crude_quality_benchmark:
  reference_api_gravity: 32.0
  # SOURCE: Indian Refinery Average Basket (Indian Oil / BPCL / HPCL Nelson Complexity Weighted Average)

  reference_sulfur_wt_pct: 2.00
  # SOURCE: Standard Arab Light / Basrah Medium Indian refinery baseline feed specification

  heavy_crude_penalty_usd_per_api_below_32: 0.25
  # SOURCE: Distillation column preheating & vacuum bottom cracking yield debit ($0.25/bbl per deg API)

  sour_crude_penalty_usd_per_0.1pct_sulfur_above_2: 0.30
  # SOURCE: Hydro-desulfurization (HDS) hydrogen consumption, Claus sulfur recovery unit & catalyst cost ($0.30/bbl per 0.1% S)

  light_crude_penalty_usd_per_api_above_38: 0.10
  # SOURCE: Light-ends / LPG distillation overhead bottleneck & middle distillate yield penalty ($0.10/bbl per deg API)

# ------------------------------------------------------------------------------
# 6. STRATEGIC PETROLEUM RESERVE (SPR) CONSTANTS
# ------------------------------------------------------------------------------
strategic_petroleum_reserve:
  baseline_spr_coverage_days: 9.5
  # SOURCE: Indian Strategic Petroleum Reserves Limited (ISPRL) Phase I capacity: 5.33 MMT (~39.5 Million Barrels)
  
  commercial_oil_company_storage_days: 64.5
  # SOURCE: MoPNG Statutory Crude & Product Inventory Buffer at refinery tank farms & coastal depots

  total_sovereign_buffer_days: 74.0
  # SOURCE: Combined ISPRL (9.5d) + Commercial (64.5d) = 74.0 days total energy security buffer

  structural_safety_floor_days: 3.0
  # SOURCE: Minimum unpumpable cavern heel & emergency unbreachable strategic floor (ISPRL operational rule)

  caverns:
    visakhapatnam:
      capacity_mmt: 1.33
      capacity_mbbl: 9.77
      connectivity: "HPCL Vizag Refinery Pipeline"
    mangalore:
      capacity_mmt: 1.50
      capacity_mbbl: 11.10
      connectivity: "MRPL Coastal Refinery Dedicated Line"
    padur:
      capacity_mmt: 2.50
      capacity_mbbl: 18.70
      connectivity: "Thurston SPM / Padur-Mangalore Corridor"
    # SOURCE: ISPRL Physical Underground Cavern Asset Registry

# ------------------------------------------------------------------------------
# 7. MARITIME SHIPPING & LOGISTICS (SEAROUTE GRAPH)
# ------------------------------------------------------------------------------
